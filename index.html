<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Guides 📚</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --card-bg: #1e293b;
            --card-hover: #334155;
            --accent-js: #f7df1e;
            --accent-react: #61dafb;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            box-sizing: border-box;
        }

        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #e2e8f0 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            font-size: 1.2rem;
            color: #94a3b8;
            margin-bottom: 3rem;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 2rem;
            text-decoration: none;
            color: var(--text-color);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            transition: height 0.3s ease;
        }

        .card.js-card::before {
            background-color: var(--accent-js);
        }

        .card.react-card::before {
            background-color: var(--accent-react);
        }

        .card:hover {
            transform: translateY(-8px);
            background-color: var(--card-hover);
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.7);
        }

        .card .icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
            transition: transform 0.3s ease;
        }

        .card:hover .icon {
            transform: scale(1.1);
        }

        .card h2 {
            font-size: 1.5rem;
            margin: 0 0 0.5rem 0;
        }

        .card p {
            color: #94a3b8;
            font-size: 0.95rem;
            margin: 0;
            line-height: 1.5;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2.5rem;
            }
            .card-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <!-- Import Inter font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <h1>Learning Hub</h1>
        <p class="subtitle">Select a topic guide to start learning</p>

        <div class="card-grid">
            <a href="js_topics_guide.html" class="card js-card">
                <div class="icon">🟨</div>
                <h2>JavaScript Guide</h2>
                <p>Comprehensive reference for modern JavaScript concepts, ES6+ features, and patterns.</p>
            </a>

            <a href="react_topics_guide.html" class="card react-card">
                <div class="icon">⚛️</div>
                <h2>React Guide</h2>
                <p>Deep dive into React, Hooks, Redux architecture, and advanced concepts.</p>
            </a>
        </div>
    </div>

</body>
</html>
